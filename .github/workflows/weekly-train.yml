name: Weekly Aegis retraining

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aegis-state-${{ github.repository }}
  cancel-in-progress: false

jobs:
  retrain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install Aegis
        run: uv sync --locked --no-dev

      - name: Restore Aegis state cache
        id: state-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .aegis/data
            .aegis/models
            .aegis/memory
          key: aegis-state-v1-${{ github.repository }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aegis-state-v1-${{ github.repository }}-${{ github.sha }}-
            aegis-state-v1-${{ github.repository }}-

      - name: Fetch Aegis state from Release
        if: steps.state-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run aegis fetch-state . --if-missing

      - name: Ensure current repository state is present
        run: |
          uv run aegis mine .
          uv run aegis index .

      - name: Retrain the general risk model from versioned D1
        run: >-
          uv run aegis train --repo all --model lr --data eval/datasets
          --models-dir .aegis/models

      - name: Publish retrained model and current Aegis state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run aegis publish-state .

      - name: Save retrained Aegis state cache
        uses: actions/cache/save@v4
        with:
          path: |
            .aegis/data
            .aegis/models
            .aegis/memory
          key: aegis-state-v1-${{ github.repository }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
