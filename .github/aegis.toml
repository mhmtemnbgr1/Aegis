# Aegis'in kendi reposunda dogfooding yapılandırması (#65).
# Action bu dosyayı PR'ın değil, taban dalın sürümünden okur.

[review]
# GitHub'ın barındırılan runner'larında Ollama yok; LLM'i açmak için Ollama'lı bir
# self-hosted runner (ollama-host) gerekir. O zamana kadar yalnızca gatekeeper + injection
# dedektörü çalışır ve çalıştırma metrikleri birikir.
llm_enabled = false
language = "Turkish"
# Bu dosyalar saldırı kalıplarını bilerek tarif eder (prompt'lar ve dedektörün kendisi).
injection_exclude = [
    "src/aegis/agents/prompts/**",
    "src/aegis/agents/injection.py",
    "src/aegis/agents/analyst.py",
]

[agents.analyst]
provider = "ollama"
model = "qwen2.5-coder:7b"
