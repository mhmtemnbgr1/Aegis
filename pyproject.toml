[project]
name = "aegis-review"
version = "0.0.1"
description = "Risk odaklı, hafızalı ve çok ajanlı PR inceleme sistemi"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "unidiff>=1.0.1",
    "pathspec>=1.1.1",
    "tenacity>=9.1.4",
    "httpx>=0.27",
    "pydriller>=2.12",
    "polars>=2.1.0",
    "tzdata>=2026.6 ; sys_platform == 'win32'",
    "scikit-learn>=1.9.1",
    "lightgbm>=4.7.0",
]

[project.scripts]
aegis = "aegis.cli:app"

[project.optional-dependencies]
ollama = [
    "ollama>=0.6.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # typer.Option() varsayılan argümanlarda kullanılır

[tool.ruff.lint.per-file-ignores]
# Sonuç belgesinin uzun Türkçe metinleri ve tablo satırları (docs/results.md üretir).
"eval/results.py" = ["E501"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pydriller", "pydriller.*", "sklearn", "sklearn.*", "lightgbm", "lightgbm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: gerçek LLM ile elle koşturulan testler (AEGIS_LIVE_PROVIDER)"]
addopts = "-m 'not live'"
