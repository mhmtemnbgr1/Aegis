name: Aegis PR Review
description: Risk odaklı, hafızalı PR incelemesi. Düşük riskli PR'larda LLM çağırmaz; PR'ı asla bloklamaz.
author: Aegis
branding:
  icon: shield
  color: blue

# Kullanım için README'deki örnek workflow'a bakın. `pull_request_target` ile kullanmayın.
inputs:
  github-token:
    description: Yorum ve check run yazmak için token (pull-requests:write, checks:write).
    default: ${{ github.token }}
  config:
    description: Taban commit'ten okunacak yapılandırma dosyasının yolu.
    default: .aegis.toml
  python-version:
    description: Python sürümü.
    default: "3.12"
  ollama-host:
    description: Ollama sunucu adresi (ör. self-hosted runner'da http://localhost:11434). Boşsa LLM analizi yapılmaz.
    default: ""
  upload-runs:
    description: Çalıştırma metriklerini (runs.jsonl) artifact olarak yükle.
    default: "true"

outputs:
  result-path:
    description: İnceleme sonucunun JSON dosyası.
    value: ${{ steps.review.outputs.result-path }}

runs:
  using: composite
  steps:
    - name: Refuse pull_request_target
      if: github.event_name == 'pull_request_target'
      shell: bash
      run: |
        echo "::error::Aegis pull_request_target ile çalıştırılamaz; 'on: pull_request' kullanın."
        exit 0

    - name: Set up uv
      if: github.event_name == 'pull_request'
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Aegis
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        AEGIS_ACTION_PATH: ${{ github.action_path }}
      run: uv tool install --quiet "$AEGIS_ACTION_PATH[ollama]"

    # Durum arşivi (#45): madencilik verisi, model ve hafıza. Önce cache, yoksa Release asset'i
    # (aegis publish-state ile yüklenir). İkisi de yoksa inceleme sezgisel kuralla, hafızasız sürer.
    - name: Restore Aegis state (cache)
      id: state-cache
      if: github.event_name == 'pull_request'
      uses: actions/cache/restore@v4
      with:
        path: |
          .aegis/data
          .aegis/models
          .aegis/memory
        key: aegis-state-v1-${{ github.repository }}-${{ github.event.pull_request.base.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          aegis-state-v1-${{ github.repository }}-${{ github.event.pull_request.base.sha }}-
          aegis-state-v1-${{ github.repository }}-

    - name: Fetch Aegis state (Release)
      if: github.event_name == 'pull_request' && steps.state-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        AEGIS_CONFIG: ${{ inputs.config }}
      run: aegis fetch-state --if-missing --config "$AEGIS_CONFIG" || true

    - name: Save Aegis state (cache)
      if: >-
        github.event_name == 'pull_request' && steps.state-cache.outputs.cache-hit != 'true'
        && hashFiles('.aegis/data/**') != ''
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: |
          .aegis/data
          .aegis/models
          .aegis/memory
        key: aegis-state-v1-${{ github.repository }}-${{ github.event.pull_request.base.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Review
      id: review
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        AEGIS_CONFIG: ${{ inputs.config }}
        OLLAMA_HOST: ${{ inputs.ollama-host }}
      run: |
        result="$RUNNER_TEMP/aegis-result.json"
        aegis github --config "$AEGIS_CONFIG" --json-out "$result" || true
        echo "result-path=$result" >> "$GITHUB_OUTPUT"

    - name: Upload run metrics
      if: always() && github.event_name == 'pull_request' && inputs.upload-runs == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: aegis-runs-${{ github.run_id }}-${{ github.run_attempt }}
        path: .aegis/runs.jsonl
        if-no-files-found: ignore
        retention-days: 90
